name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pulsetrack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Run Ruff Lint
        run: ruff check .

      - name: Run Ruff Format Check
        run: ruff format --check .

      - name: Run Mypy Static Type Analysis
        run: mypy --strict app

      - name: Run Bandit Security Scanner
        run: bandit -r app -x app/tests

      - name: Run Pytest Suite with Coverage
        env:
          ENVIRONMENT: testing
          LOG_LEVEL: DEBUG
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/pulsetrack_test
          REDIS_URL: redis://localhost:6379/0
          RATE_LIMIT_DEFAULT_PER_MINUTE: 600
        run: pytest --cov=app --cov-report=term-missing
